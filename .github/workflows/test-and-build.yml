name: Test and Build
on:
    push:
    pull_request:

jobs:
    test_and_build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Setup .npmrc file to publish to npm
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
            - run: npm install
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build
